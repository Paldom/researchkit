# researchkit model presets.
#
# Pick a preset with `active_preset` (or per-run via `--preset`). Each preset
# maps every pipeline slot to a model and sets search/effort/budget knobs.
# `optimal` comes from a 9-setup LLM-as-judge benchmark: summary quality was
# ~flat across model tiers, so cheap+fast setups win the combined
# quality/sources/time/price objective.
#
# CLI-backed slots (advanced, all opt-in):
# - `openai: codex` or `codex:<model>` routes the OpenAI step through the
#   Codex CLI (`codex exec`, ChatGPT-subscription billing).
# - `gemini: agy` or `agy:<model>` routes the Gemini step through the
#   Antigravity CLI with Google Search grounding.
# - `grok: grokcli` or `grokcli:<model>` routes the Grok step through the
#   Grok CLI's headless mode (`grok -p`, grok.com-subscription billing via
#   `grok login` instead of XAI_API_KEY; `grok models` lists model ids).
# - `kimi: kimicli` or `kimicli:<alias>` routes the Kimi step through the
#   Kimi Code CLI's headless mode (`kimi -p`, kimi.com-subscription billing
#   via `kimi login` instead of MOONSHOT_API_KEY/KIMI_API_KEY; aliases like
#   `kimi-code/k3` come from the CLI's config.toml).
# CLI-backed specs work in EVERY model slot: providers, council members,
# summarizer, site_summarizer, and improver (claude* specs in summary slots
# run under the default $3 CLI budget — prefer codex/agy/grokcli there).
# Two caveats: site_summarizer is high-volume (a CLI spec is slower than the
# Gemini API), and a CLI site_summarizer for youtube only summarizes fetched
# transcripts (Gemini's native video understanding needs the API).
# - `claude: claude:<model>` is the canonical Claude spec (Claude Code CLI,
#   Claude-subscription billing). The part after `claude:` goes to
#   `claude --model` verbatim — an alias (`claude:opus`) or full id
#   (`claude:claude-sonnet-5-5`). Bare ids (`claude-sonnet-5-5`) are the
#   legacy spelling of the same route. There is no Anthropic API route:
#   every Claude step (research slot, writers, council, boss) runs on Claude
#   Code with ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, ANTHROPIC_BASE_URL and
#   the Bedrock/Vertex/Foundry/Mantle switches stripped from its env.
# - `claude: deep` or `deep:<model>` routes the Claude step through Claude
#   Code's /deep-research workflow (fan-out searches, verified claims, cited
#   report). Powerful but slow (10-40 min) and expensive: every workflow
#   subagent inherits the chosen model — prefer sonnet, never opus. The
#   claude_max_budget cap is enforced lazily mid-workflow; an over-budget run
#   is killed WITHOUT returning a report, so set it well above the realistic
#   cost (>= 15-20) when using deep mode. NEVER ship deep: as a default —
#   it runs a CLI subprocess with web access on every default invocation.

active_preset: hybrid

presets:
  default:
    description: Latest models with best quality
    models:
      openai: gpt-5.4-mini # latest mini tier (5.5/5.6/6 ship no mini)
      gemini: gemini-3.8-flash
      grok: grok-4.3
      perplexity: sonar
      tavily: tavily-search # display name only (search API)
      claude: claude:claude-sonnet-5-5 # plain two-query mode; `deep:<model>` opt-in (see header)
      github: gpt-5.4-mini
      glm: glm-5.3
      kimi: kimi-k3 # Moonshot API (opt-in via --providers kimi)
      summarizer: gemini-3.8-flash # cross-provider meta-summary
      site_summarizer: gemini-3.5-flash-lite # site-research summarization (high volume — keep it cheap)
      improver: gpt-5.4-mini # topic improvement + keyword generation
    reasoning_effort: medium
    perplexity_search_type: pro # fast | auto | pro
    tavily_search_depth: advanced # basic | advanced | fast | ultra-fast
    claude_max_budget: 5.0 # max USD per Claude Code query
    # LLM council for topic improvement + keyword generation (boosted runs).
    # Members accept CLI specs (codex:<m>, agy:<m>) or plain model ids.
    council:
      members:
        - claude:claude-opus-5-5
        - gpt-6-astra
        - gemini-3.8-flash
      boss: claude:claude-opus-5-5
    # Boost fans a topic out into parallel sub-projects topped by a
    # super-summary. Off by default: a boosted run multiplies cost by the
    # number of sub-projects. Enable deliberately (or per-run via --boost).
    boost:
      enabled: false
      max_subprojects: 5

  optimal:
    description: Best balance — fastest, cheapest, summary within noise of the best (the cheap+fast shape won a 9-setup bench at 0.91; pins tracked forward to current models)
    models:
      openai: gpt-5.4-nano
      gemini: gemini-3.5-flash-lite
      grok: grok-4.6
      perplexity: sonar
      tavily: tavily-search
      claude: claude:claude-haiku-4-5
      github: gpt-5.4-mini
      glm: glm-5-turbo # z.ai retired glm-4.7-flashx; turbo is the cheap tier now
      kimi: kimi-k3
      summarizer: gemini-3.5-flash-lite
      site_summarizer: gemini-3.5-flash-lite
      improver: gpt-5.4-nano
    reasoning_effort: low
    perplexity_search_type: fast # fast = more sources, less time/cost
    tavily_search_depth: fast
    claude_max_budget: 3.0

  optimal_quality:
    description: Quality cushion — sweet-spot models, more sources, robust on harder topics (bench 0.74; pins tracked forward to current models)
    models:
      openai: gpt-5.4-mini
      gemini: gemini-3.8-flash
      grok: grok-4.6
      perplexity: sonar-pro
      tavily: tavily-search
      claude: claude:claude-sonnet-5-5
      github: gpt-5.4-mini
      glm: glm-5.3
      kimi: kimi-k3
      summarizer: gemini-3.8-flash
      site_summarizer: gemini-3.5-flash-lite
      improver: gpt-5.4-mini
    reasoning_effort: low
    perplexity_search_type: fast
    tavily_search_depth: fast
    claude_max_budget: 5.0

  budget_friendly:
    description: Cost-effective models for faster iteration
    models:
      openai: gpt-5.4-mini
      gemini: gemini-3.5-flash-lite
      grok: grok-4.6
      perplexity: sonar
      tavily: tavily-search
      claude: claude:claude-sonnet-5-5
      github: gpt-5.4-mini
      glm: glm-5.3
      kimi: kimi-k3
      summarizer: gemini-3.8-flash
      site_summarizer: gemini-3.5-flash-lite
      improver: gpt-5.4-mini
    reasoning_effort: medium
    perplexity_search_type: fast
    tavily_search_depth: fast
    claude_max_budget: 5.0

  harness:
    description: Subscription-only — every LLM step runs on logged-in CLI harnesses (Codex, Antigravity, Grok CLI, Kimi Code CLI, Claude Code); search APIs (Perplexity, Tavily, Exa) stay allowed. Used by `advise`/`council`/`explore` and the UI's "harness only" mode.
    # Refuse, before any spend, a run whose LLM steps would bill an API (see
    # `harness_only` in docs/models-guide.md); `researchkit doctor` reports it.
    harness_only: true
    # Run defaults when the caller names none: the five CLI harnesses plus the
    # keyless sources, and no keyword site research (Exa + plugin connectors).
    providers:
      [
        openai,
        gemini,
        grok,
        claude,
        kimi,
        hackernews,
        skillsh,
        arxiv,
        stackexchange,
        openalex,
      ]
    site_research: false
    models:
      openai: codex:gpt-6.1-sol # Codex CLI, ChatGPT-subscription billing
      gemini: agy:gemini-3.8-flash-high # Antigravity CLI, Google account (`agy models` lists ids; effort is baked into the id)
      grok: grokcli:grok-4.7 # Grok CLI, grok.com subscription (`grok models` lists ids)
      perplexity: sonar # unused: not in the harness provider set
      tavily: tavily-search # unused
      claude: claude:claude-opus-5-5 # Claude Code CLI, Claude subscription
      github: codex:gpt-6.1-sol # GitHub REST search + analysis on Codex; the API-only github.com web search is skipped
      glm: glm-5.3 # API only, no harness route: a harness_only run refuses it
      kimi: kimicli:kimi-code/k3 # Kimi Code CLI, kimi.com subscription
      summarizer: codex:gpt-6.1-sol # meta-summary via CLI (no API key; codex handles long prompts reliably)
      site_summarizer: codex:gpt-6.1-sol # CLI too (site research off by default in harness flows; connector SEARCH keys still apply if enabled)
      improver: codex:gpt-6.1-sol # CLI too (keyword synthesis / improve-topic without OpenAI key)
    reasoning_effort: xhigh # codex/claude/grokcli honor it; agy has no effort control
    perplexity_search_type: fast
    tavily_search_depth: fast
    claude_max_budget: 15.0 # opus + web search needs headroom (lazy cap, see header)
    council:
      # <spec>@<effort> sets per-member reasoning effort where supported.
      members:
        - claude:claude-opus-5-5@xhigh
        - codex:gpt-6.1-sol@xhigh
        - agy:gemini-3.8-flash-high # effort is part of the agy model id
        - grokcli:grok-4.7
        - kimicli:kimi-code/k3 # effort comes from the CLI's config.toml [thinking]
      boss: claude:claude-opus-5-5@xhigh
    boost:
      enabled: true
      max_subprojects: 3 # harness sub-runs are slow; keep the fan-out tight
    plugins:
      # Each web-UI deep research is a browser session that streams for minutes,
      # so the site list is the cost dial: one site per run unless you mean it.
      webui:
        sites: [chatgpt]

  harness-fast:
    # `harness` minus the time outliers. Providers run concurrently, so a run is
    # as slow as its slowest member: measured on this machine's harness runs the
    # Codex research slot takes 30-55 min per call and Opus at max effort 11-17,
    # while Antigravity, Grok CLI and Kimi finish in 1-4 min. The explore-fast
    # skill pairs this preset with a provider list that skips the openai and
    # claude research slots and a RESEARCHKIT_CLI_TIMEOUT cap on stragglers.
    description: Subscription-only, time-boxed — the harness preset without the slow outliers (no Codex research, Sonnet writes the summaries, council without Codex)
    harness_only: true
    # The explore-fast set: no Codex/Claude research slots (the time outliers).
    providers:
      [gemini, grok, kimi, hackernews, skillsh, arxiv, stackexchange, openalex]
    site_research: false
    models:
      openai: codex:gpt-6.1-sol # kept for parity; explore-fast does not run this slot
      gemini: agy:gemini-3.8-flash-high
      grok: grokcli:grok-4.7
      perplexity: sonar # unused
      tavily: tavily-search # unused
      claude: claude:claude-sonnet-5-5 # the four writers (overview, digest, article, skill) run here
      github: codex:gpt-6.1-sol # GitHub REST search + analysis on Codex
      glm: glm-5.3 # API only: a harness_only run refuses it
      kimi: kimicli:kimi-code/k3
      summarizer: codex:gpt-6.1-sol # one long-prompt completion, not a research loop: fast enough
      site_summarizer: codex:gpt-6.1-sol
      improver: codex:gpt-6.1-sol
    reasoning_effort: high
    perplexity_search_type: fast
    tavily_search_depth: fast
    claude_max_budget: 15.0
    council:
      members:
        - claude:claude-sonnet-5-5@high
        - agy:gemini-3.8-flash-high
        - grokcli:grok-4.7@high
        - kimicli:kimi-code/k3
      boss: claude:claude-opus-5-5@high # one synthesis call; quality matters more than the minutes here
    boost:
      enabled: true
      max_subprojects: 3
    plugins:
      webui:
        sites: [chatgpt]

  hybrid:
    description: Harnesses + search APIs + site research combined — CLI subscriptions for reasoning, API endpoints for breadth
    models:
      openai: codex:gpt-6.1-sol # harness (ChatGPT subscription)
      gemini: gemini-3.8-flash # API — keeps one fast native search-grounded provider
      grok: grokcli:grok-4.7 # harness (grok.com subscription)
      perplexity: sonar # search API
      tavily: tavily-search # search API
      claude: claude:claude-opus-5-5 # harness (Claude subscription)
      github: gpt-5.4-mini
      glm: glm-5.3
      kimi: kimicli:kimi-code/kimi-for-coding # harness (kimi.com subscription; K2.7, faster than k3)
      summarizer: codex:gpt-6.1-sol # meta-summary on the CLI
      site_summarizer: gemini-3.5-flash-lite # API: site research is high-volume, keep it fast/cheap
      improver: codex:gpt-6.1-sol # keyword synthesis / improve-topic on the CLI
    reasoning_effort: high
    perplexity_search_type: fast
    tavily_search_depth: advanced
    claude_max_budget: 10.0
    council:
      members:
        - claude:claude-fable-5-1@xhigh
        - codex:gpt-6.1-sol@xhigh
        - gemini-3.8-flash # API member — mixing works here too
        - grokcli:grok-4.7
        - kimicli:kimi-code/kimi-for-coding
      boss: claude:claude-opus-5-5@xhigh
    boost:
      enabled: false
      max_subprojects: 4
